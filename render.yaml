services:
  - type: web
    # The service name sets the default subdomain:
    # https://ott-fundamentals.onrender.com
    name: ott-fundamentals
    runtime: static
    buildCommand: echo "No build required"
    staticPublishPath: ./
    headers:
      - path: /data/book.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
