services:
  - type: web
    name: ott-fundamentals-of-catholic-dogma
    runtime: static
    buildCommand: echo "No build required"
    staticPublishPath: ./
    headers:
      - path: /data/book.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
